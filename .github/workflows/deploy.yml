name: Deploy Firestore Rules & Indexes

on:
  push:
    branches: [ main ]

jobs:
  deploy-firestore:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Firebase
        run: npx firebase deploy --only firestore:rules,firestore:indexes --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSE }}
