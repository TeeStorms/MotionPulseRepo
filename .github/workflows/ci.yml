name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android-test-and-build:
    name: Android Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Inject google-services.json from secret (Base64 or Raw)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "Decoding GOOGLE_SERVICES_JSON_B64..."
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Using GOOGLE_SERVICES_JSON..."
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "Warning: No google-services secrets set. Creating dummy google-services.json for build."
            echo '{"project_info": {"project_number": "123456789", "project_id": "pulse-702e8", "storage_bucket": "pulse-702e8.appspot.com"}, "client": [{"client_info": {"mobilesdk_app_id": "1:123456789:android:123456789abcdef"}, "oauth_client": [], "services": {"analytics_service": {"status": "1"}, "app_invite_service": {"status": "1"}, "ads_service": {"status": "1"}}}]} ' > app/google-services.json
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

  firestore-rules-test:
    name: Firestore Security Rules Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore Rules Unit Tests
        run: npx firebase emulators:exec --only firestore "npm test"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSE }}
